services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend-prod
    ports:
      - "9201:8000"
    environment:
      - REDIS_HOST=redis
      - MINIO_ENDPOINT=minio:9000
    depends_on:
      - redis
      - minio
      - mongodb
    volumes:
      - .:/app
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: redis-prod
    ports:
      - "9202:6379"
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: minio-prod
    ports:
      - "9203:9000"
      - "9204:9001"
    environment:
      - MINIO_ROOT_USER=minio
      - MINIO_ROOT_PASSWORD=minio123
    command: server /data --address ":9000" --console-address ":9001"
    volumes:
      - trinitybackendfastapi_minio_data_prod:/data
    restart: unless-stopped

  mongodb:
    image: mongo:7.0
    container_name: mongodb-prod
    ports:
      - "9205:27017"
    environment:
      - MONGO_INITDB_DATABASE=app_prod
    volumes:
      - trinitybackendfastapi_mongodb_data_prod:/data/db
    restart: unless-stopped

volumes:
  trinitybackendfastapi_minio_data_prod:
  trinitybackendfastapi_mongodb_data_prod:
